<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السولي ستور | Soly Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fdfbf7; color: #4a403a; }
        .feminine-card { background: #ffffff; border: 1px solid #fbcfe8; border-radius: 1rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b border-pink-100 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-2xl font-bold text-pink-600">✨ السولي ستور</span>
            <span class="text-xs bg-pink-100 text-pink-700 px-2 py-1 rounded-full">عناية وبروتين الشعر</span>
        </div>
        <div>
            <button onclick="openAdminPanel()" class="text-xs text-gray-400 hover:text-pink-600 transition bg-gray-50 border px-3 py-1.5 rounded-lg">دخول الإدارة ⚙️</button>
        </div>
    </header>

    <!-- ================= 1. قسم الزبائن (المتجر الأساسي) ================= -->
    <main id="customerSection" class="flex-grow container mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-pink-700 mb-2">أجود منتجات الرووتين والبروتين لشعر صحي ولامع</h1>
            <p class="text-gray-500">اختاري منتجاتك المفضلة وتمتعي بإطلالة ساحرة</p>
        </div>
        <div id="customerProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="col-span-full text-center text-gray-400">جاري تحميل المنتجات...</p>
        </div>
    </main>

    <!-- ================= 2. قسم لوحة التحكم (مخفي ولا يظهر إلا بالباسورد) ================= -->
    <main id="adminSection" class="flex-grow container mx-auto px-4 py-8 hidden">
        <div class="flex justify-between items-center mb-6 bg-pink-50 p-4 rounded-xl border border-pink-200">
            <h2 class="text-xl font-bold text-pink-700">⚙️ لوحة تحكم الحسابات والمخزن</h2>
            <button onclick="closeAdminPanel()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition">إغلاق الإدارة والعودة للمتجر 🛍️</button>
        </div>

        <!-- إضافة منتج -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-pink-200 mb-8">
            <h3 class="text-lg font-bold text-pink-600 mb-4">إضافة منتج جديد وحساب الأرباح 📊</h3>
            <form id="addProductForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-pink-50/50 p-4 rounded-xl border border-pink-100">
                <div>
                    <label class="block text-sm font-semibold mb-1">اسم المنتج</label>
                    <input type="text" id="prodName" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">التكلفة (السعر الأصلي)</label>
                    <input type="number" id="prodCost" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none" placeholder="جنيه">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">سعر البيع للزبون</label>
                    <input type="number" id="prodPrice" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none" placeholder="جنيه">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">الكمية بالمخزن</label>
                    <input type="number" id="prodStock" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none" value="10">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">رابط صورة المنتج</label>
                    <input type="url" id="prodImage" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none" placeholder="https://...">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold py-2 px-4 rounded-lg transition shadow-sm">حفظ وإضافة للمخزن</button>
                </div>
            </form>
        </div>

        <!-- جدول الحسابات والمكسب -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-pink-200">
            <h3 class="text-lg font-bold text-gray-7
