<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السولي ستور | Soly Store - عناية وبروتين الشعر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fdfbf7; color: #4a403a; }
        .feminine-card { background: #ffffff; border: 1px solid #fbcfe8; border-radius: 1rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b border-pink-100 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-2xl font-bold text-pink-600">✨ السولي ستور</span>
            <span class="text-xs bg-pink-100 text-pink-700 px-2 py-1 rounded-full">عناية وبروتين الشعر</span>
        </div>
        <div>
            <a href="admin.html" class="text-xs text-gray-400 hover:text-pink-600 transition">دخول الإدارة ⚙️</a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-pink-700 mb-2">أجود منتجات الرووتين والبروتين لشعر صحي ولامع</h1>
            <p class="text-gray-500">اختاري منتجاتك المفضلة وتمتعي بإطلالة ساحرة</p>
        </div>
        <!-- شبكة المنتجات للزبائن -->
        <div id="customerProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-pink-100 py-4 text-center text-xs text-gray-400">
        جميع الحقوق محفوظة © Soly Store 2026
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // استبدل الإعدادات ببيانات مشروعك في Firebase
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadCustomerProducts() {
            const grid = document.getElementById('customerProductsGrid');
            grid.innerHTML = "<p class='col-span-full text-center text-gray-400'>جاري تحميل المنتجات...</p>";
            
            try {
                const querySnapshot = await getDocs(collection(db, "soly_products"));
                grid.innerHTML = "";
                
                if(querySnapshot.empty) {
                    grid.innerHTML = "<p class='col-span-full text-center text-gray-400'>لا توجد منتجات مضافة حالياً.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const id = docSnap.id;
                    
                    grid.innerHTML += `
                        <div class="feminine-card p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition">
                            <div>
                                <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover rounded-lg mb-3 border border-pink-50" onerror="this.src='https://via.placeholder.com/300?text=Soly+Store'">
                                <h3 class="font-bold text-lg text-gray-800 mb-1">${p.name}</h3>
                                <p class="text-pink-600 font-bold text-xl mb-3">${p.price} جنيه</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 mb-3">المتبقي بالمخزن: <span class="font-semibold text-gray-600">${p.stock}</span></p>
                                <button onclick="buyProduct('${id}', ${p.stock})" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-2 rounded-lg text-sm font-semibold transition ${p.stock <= 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${p.stock <= 0 ? 'disabled' : ''}>
                                    ${p.stock > 0 ? 'اطلبي الآن 🛍️' : 'نفذت الكمية'}
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                grid.innerHTML = "<p class='col-span-full text-center text-red-400'>حدث خطأ في تحميل المنتجات.</p>";
            }
        }

        window.buyProduct = async function(id, currentStock) {
            if(currentStock <= 0) {
                alert("عذراً، هذا المنتج نفذ من المخزن!");
                return;
            }
            if(confirm("هل متأكدة من إتمام طلب هذا المنتج؟ سيتم تحديث المخزن فوراً.")) {
                const prodRef = doc(db, "soly_products", id);
                await updateDoc(prodRef, {
                    stock: increment(-1)
                });
                alert("تم تسجيل الطلب بنجاح وتحديث المخزن! 🎉");
                loadCustomerProducts();
            }
        }

        loadCustomerProducts();
    </script>
</body>
</html>
